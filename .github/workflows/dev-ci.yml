name: DEV CI

on:
  push:
    branches:
      - develop

jobs:
  Run-PR-Test:
    name: Lint & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle
        with:
          base-url: ${{ secrets.BASE_URL }}
          base-url-dev: ${{ secrets.BASE_URL_DEV }}
          image-base-url: ${{ secrets.IMAGE_BASE_URL }}
          image-base-url-dev: ${{ secrets.IMAGE_BASE_URL_DEV }}
          naver-map-client-id: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          naver-map-style-id: ${{ secrets.NAVER_MAP_STYLE_ID }}
          app-bundle-id: ${{ secrets.APP_BUNDLE_ID }}
          app-bundle-id-dev: ${{ secrets.APP_BUNDLE_ID_DEV }}
          store-password: ${{ secrets.STORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Generate BuildKonfig
        run: ./gradlew :composeApp:generateBuildKonfig -Pbuildkonfig.flavor=dev

      - name: Run ktlint
        run: ./gradlew ktlintCheck -Pbuildkonfig.flavor=dev

      - name: Run unit tests
        run: ./gradlew :composeApp:allTest -Pbuildkonfig.flavor=dev

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: composeApp/build/test-results/**/*.xml
          check_name: '테스트 결과 (DEV) 🛠️'
          comment_mode: 'off'

  build-android:
    name: Build Android (Debug APK)
    needs: Run-PR-Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle
        with:
          base-url: ${{ secrets.BASE_URL }}
          base-url-dev: ${{ secrets.BASE_URL_DEV }}
          image-base-url: ${{ secrets.IMAGE_BASE_URL }}
          image-base-url-dev: ${{ secrets.IMAGE_BASE_URL_DEV }}
          naver-map-client-id: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          naver-map-style-id: ${{ secrets.NAVER_MAP_STYLE_ID }}
          app-bundle-id: ${{ secrets.APP_BUNDLE_ID }}
          app-bundle-id-dev: ${{ secrets.APP_BUNDLE_ID_DEV }}
          store-password: ${{ secrets.STORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug -Pbuildkonfig.flavor=dev

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 3

  build-ios:
    name: Build iOS (Debug IPA)
    needs: Run-PR-Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle
        with:
          base-url: ${{ secrets.BASE_URL }}
          base-url-dev: ${{ secrets.BASE_URL_DEV }}
          image-base-url: ${{ secrets.IMAGE_BASE_URL }}
          image-base-url-dev: ${{ secrets.IMAGE_BASE_URL_DEV }}
          naver-map-client-id: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          naver-map-style-id: ${{ secrets.NAVER_MAP_STYLE_ID }}
          app-bundle-id: ${{ secrets.APP_BUNDLE_ID }}
          app-bundle-id-dev: ${{ secrets.APP_BUNDLE_ID_DEV }}
          store-password: ${{ secrets.STORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install certificates and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DEV_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Load GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEBUG }}" | base64 --decode > iosApp/iosApp/GoogleService-Info-DEBUG.plist
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_RELEASE }}" | base64 --decode > iosApp/iosApp/GoogleService-Info-RELEASE.plist

      - name: Pod install
        working-directory: iosApp
        run: pod install

      - name: Build & Archive (Debug)
        run: |
          xcodebuild archive \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/festabook-dev.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_DEV_PROVISIONING_PROFILE_NAME }}"

      - name: Export IPA (ad-hoc)
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>eoehdeksruf.festabook.debug</key>
              <string>${{ secrets.IOS_DEV_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/festabook-dev.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa-dev

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa
          path: ${{ runner.temp }}/ipa-dev/*.ipa
          retention-days: 3