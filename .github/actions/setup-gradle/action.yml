name: Setup Gradle Environment
description: JDK 설정, Gradle 캐시, local.properties 생성, keystore 및 google-services.json 복원

inputs:
  base-url:
    required: true
  base-url-dev:
    required: true
  image-base-url:
    required: true
  image-base-url-dev:
    required: true
  naver-map-client-id:
    required: true
  naver-map-style-id:
    required: true
  app-bundle-id:
    required: true
  app-bundle-id-dev:
    required: true
  store-password:
    required: true
  key-alias:
    required: true
  key-password:
    required: true
  keystore-base64:
    required: true
  google-services-json:
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create local.properties
      shell: bash
      run: |
        echo "BASE_URL=${{ inputs.base-url }}" > local.properties
        echo "BASE_URL_DEV=${{ inputs.base-url-dev }}" >> local.properties
        echo "IMAGE_BASE_URL=${{ inputs.image-base-url }}" >> local.properties
        echo "IMAGE_BASE_URL_DEV=${{ inputs.image-base-url-dev }}" >> local.properties
        echo "NAVER_MAP_CLIENT_ID=${{ inputs.naver-map-client-id }}" >> local.properties
        echo "NAVER_MAP_STYLE_ID=${{ inputs.naver-map-style-id }}" >> local.properties
        echo "APP_BUNDLE_ID=${{ inputs.app-bundle-id }}" >> local.properties
        echo "APP_BUNDLE_ID_DEV=${{ inputs.app-bundle-id-dev }}" >> local.properties
        echo "JKS_FILE_PATH=./composeApp/festabook_appkey.jks" >> local.properties
        echo "STORE_PASSWORD=${{ inputs.store-password }}" >> local.properties
        echo "KEY_ALIAS=${{ inputs.key-alias }}" >> local.properties
        echo "KEY_PASSWORD=${{ inputs.key-password }}" >> local.properties

    - name: Restore keystore
      shell: bash
      run: echo "${{ inputs.keystore-base64 }}" | base64 --decode > ./composeApp/festabook_appkey.jks

    - name: Load Google Service file
      shell: bash
      env:
        DATA: ${{ inputs.google-services-json }}
      run: echo "$DATA" > composeApp/google-services.json