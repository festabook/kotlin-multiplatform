kotlin.native.binary.stripDebugSymbols=false
kotlin.native.cacheKind=static
kotlin.native.disableCompilerDaemon=false

buildkonfig.flavor=release

APP_VERSION_NAME=2.1.1
APP_VERSION_CODE=2010103
